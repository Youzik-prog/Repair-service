<div class="container form-card card">

    <div class="form-name-container">
        <h2>Профиль пользователя</h2>
        <button (click)="closeUserProfile.emit()" class="close-button">x</button>
    </div>

    <div class="content">
        <label>{{ userConfig['name'].label }}</label>
        <p class="value">{{ user().name }}</p>
        
        <label>{{ userConfig['lastName'].label }}</label>
        <p class="value">{{ user().lastName ?? 'отсутствует' }}</p>

        <label>{{ userConfig['password'].label }}</label>
        <p class="value">{{ '*'.repeat(user().password.length) }}</p>

        <label>{{ userConfig['email'].label }}</label>
        <p class="value">{{ user().email ?? 'отсутствует' }}</p>

        <label>{{ userConfig['phone'].label }}</label>
        <p class="value">{{ user().phone ?? 'отсутствует' }}</p>

        <label>{{ userConfig['type'].label }}</label>
        <p class="value">{{ user().type }}</p>

        <div class="logout-container">
            <button (click)="logout.emit()" class="logout negative">Выйти</button>
        </div>
    </div>
</div>
