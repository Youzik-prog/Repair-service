<form [formGroup]="loginForm" (ngSubmit)="loginAdmin()">
    <label for="login">Электронная почта или номер телефона</label>
    <input type="text" id="login" formControlName="login">

    <label for="password">Пароль</label>
    <input type="password" id="password" autocomplete="current-password" formControlName="password">

    <button type="submit" [disabled]="loginForm.invalid">Войти</button>
</form>
