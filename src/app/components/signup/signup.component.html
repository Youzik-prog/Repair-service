<form [formGroup]="signUpForm" (ngSubmit)="onSignUp()">
    <h2>Регистрация</h2>
    <label for="name">Имя</label>
    <input type="text" id="name" autocomplete="given-name" required formControlName="name">

    <label for="last-name">Фамилия</label>
    <input type="text" id="last-name" autocomplete="family-name" formControlName="lastName">

    <label for="password">Пароль (минимум 4 символа)</label>
    <input type="password" id="password" autocomplete="new-password" required formControlName="password">

    <label for="email">Электронная почта</label>
    <input type="email" id="email" autocomplete="email" formControlName="email">

    <label for="phone">Номер телефона</label>
    <input type="tel" id="phone" autocomplete="tel" formControlName="phone">

    <button type="submit" [disabled]="signUpForm.invalid">Зарегестрироваться</button>
    
</form>
